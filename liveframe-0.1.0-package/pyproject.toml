[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "liveframe"
version = "0.2.0"
description = "Runtime-neutral streaming measurement APIs and evidence verification for autoregressive diffusion video."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Kumar K. Jha", email = "kumar.krishnanand@gmail.com" }]
requires-python = ">=3.10"
keywords = ["diffusion", "video-generation", "benchmarking", "reproducibility", "mlx", "cuda"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/kkjcodes/liveframe"

[project.scripts]
liveframe = "liveframe.cli:main"

[tool.hatch.build.targets.sdist]
ignore-vcs = true
only-include = ["src", "tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/liveframe"]
