name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # world extra: the world-harness tests import numpy/opencv at collection.
      - run: python -m pip install -e '.[dev,world]'
      - run: ruff check .
      - run: mypy
      - run: pytest
